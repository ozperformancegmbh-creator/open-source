<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steuergerät einsenden – Reparatur-Konfigurator | OZ Performance GmbH Bochum</title>
<meta name="description" content="Getriebesteuergerät oder Mechatronik zur Reparatur einsenden: Gerät wählen, Fehler beschreiben, Versand festlegen und Arbeitskarte drucken.">
<meta name="format-detection" content="telephone=no">
<!--
  OZ Performance – Steuergeräte-Reparatur-Konfigurator
  Eine einzige Datei: Styles, Konfiguration und Programm sind unten in drei
  klar getrennten Blöcken abgelegt. Es werden keine externen Dateien, Schriften
  oder Skripte geladen.

  BLOCK 1  <style id="ozk-styles">          Gestaltung (alles unter .ozk gekapselt)
  BLOCK 2  <script id="ozk-konfiguration">  ALLE Geschäftsdaten – hier bearbeiten
  BLOCK 3  <script id="ozk-programm">       Programmlogik – normalerweise nicht anfassen
-->
<style id="ozk-styles">
/* ---------- Farben und Grundwerte (hell) ---------- */
.ozk, .ozk-druck {
  --ozk-bg: #f4f4f5;
  --ozk-flaeche: #ffffff;
  --ozk-flaeche-2: #f4f4f5;
  --ozk-rand: #d4d4d8;
  --ozk-rand-stark: #8e8e99;
  --ozk-text: #131315;
  --ozk-text-leise: #5b5b66;
  --ozk-primaer: #d51a21;
  --ozk-primaer-dunkel: #bf181d;
  --ozk-primaer-text: #b3151b;
  --ozk-primaer-flaeche: #fdeced;
  --ozk-auf-primaer: #ffffff;
  --ozk-fehler: #b3151b;
  --ozk-fehler-flaeche: #fdeced;
  --ozk-ok: #156b3a;
  --ozk-ok-flaeche: #e7f5ec;
  --ozk-hinweis-flaeche: #fff6dd;
  --ozk-hinweis-rand: #d9a400;
  --ozk-fokus: #0b57d0;
  --ozk-radius: 14px;
  --ozk-radius-klein: 10px;
  --ozk-schrift: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --ozk-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
/* ---------- Farben dunkel (entspricht der Website) ---------- */
@media (prefers-color-scheme: dark) {
  .ozk:not([data-theme="hell"]) {
    --ozk-bg: #0c0c0d; --ozk-flaeche: #131315; --ozk-flaeche-2: #1b1b1e; --ozk-rand: #2e2e33;
    --ozk-rand-stark: #6b6b75; --ozk-text: #ececef; --ozk-text-leise: #a3a3ad;
    --ozk-primaer: #d51a21; --ozk-primaer-dunkel: #bf181d; --ozk-primaer-text: #ff7a7e;
    --ozk-primaer-flaeche: #2a1012; --ozk-fehler: #ff8a80; --ozk-fehler-flaeche: #2a1012;
    --ozk-ok: #6fd39a; --ozk-ok-flaeche: #0f2418; --ozk-hinweis-flaeche: #241d08;
    --ozk-hinweis-rand: #b58900; --ozk-fokus: #8ab4ff; color-scheme: dark;
  }
}
.ozk[data-theme="dunkel"] {
  --ozk-bg: #0c0c0d; --ozk-flaeche: #131315; --ozk-flaeche-2: #1b1b1e; --ozk-rand: #2e2e33;
  --ozk-rand-stark: #6b6b75; --ozk-text: #ececef; --ozk-text-leise: #a3a3ad;
  --ozk-primaer: #d51a21; --ozk-primaer-dunkel: #bf181d; --ozk-primaer-text: #ff7a7e;
  --ozk-primaer-flaeche: #2a1012; --ozk-fehler: #ff8a80; --ozk-fehler-flaeche: #2a1012;
  --ozk-ok: #6fd39a; --ozk-ok-flaeche: #0f2418; --ozk-hinweis-flaeche: #241d08;
  --ozk-hinweis-rand: #b58900; --ozk-fokus: #8ab4ff; color-scheme: dark;
}

/* ---------- Grundlayout ---------- */
body.ozk-seite { margin: 0; }
.ozk { background: var(--ozk-bg); color: var(--ozk-text); font-family: var(--ozk-schrift);
  font-size: 16px; line-height: 1.5; min-height: 100vh; -webkit-text-size-adjust: 100%; }
.ozk.ist-eingebettet { min-height: 0; }
.ozk *, .ozk *::before, .ozk *::after { box-sizing: border-box; }
.ozk-innen { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
.ozk h1, .ozk h2, .ozk h3, .ozk h4, .ozk p, .ozk ul, .ozk ol, .ozk dl, .ozk dd, .ozk fieldset, .ozk legend { margin: 0; padding: 0; }
.ozk ul, .ozk ol { list-style: none; }
.ozk fieldset { border: 0; min-width: 0; }
.ozk a { color: var(--ozk-primaer-text); text-underline-offset: 3px; }
.ozk :focus-visible { outline: 3px solid var(--ozk-fokus); outline-offset: 2px; border-radius: 4px; }
.ozk [tabindex="-1"]:focus { outline: none; }
.ozk-nur-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.ozk-marke { font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ozk-primaer-text); }
.ozk-mono { font-family: var(--ozk-mono); font-variant-numeric: tabular-nums; }

/* ---------- Seitenkopf ---------- */
.ozk-kopf { padding: 12px 0 24px; max-width: 760px; }
.ozk-kopf h1 { font-size: clamp(1.6rem, 5.4vw, 2.5rem); line-height: 1.12; letter-spacing: -.02em; font-weight: 800; margin: 8px 0 12px; text-wrap: balance; }
.ozk-kopf p { color: var(--ozk-text-leise); font-size: 1.05rem; max-width: 62ch; }

/* ---------- Ablauf (4 Schritte) ---------- */
.ozk-ablauf { margin-bottom: 28px; }
.ozk-ablauf h2, .ozk-faq h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 12px; }
.ozk-ablauf ol { display: grid; gap: 10px; grid-template-columns: 1fr; counter-reset: ablauf; }
.ozk-ablauf li { counter-increment: ablauf; background: var(--ozk-flaeche); border: 1px solid var(--ozk-rand); border-radius: var(--ozk-radius); padding: 14px 16px 14px 56px; position: relative; }
.ozk-ablauf li::before { content: counter(ablauf); position: absolute; left: 14px; top: 14px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9rem; color: var(--ozk-primaer-text); border: 2px solid var(--ozk-primaer); }
.ozk-ablauf h3 { font-size: 1rem; font-weight: 700; }
.ozk-ablauf p { font-size: .92rem; color: var(--ozk-text-leise); margin-top: 2px; }

/* ---------- Raster Wizard + Seitenleiste ---------- */
.ozk-raster { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.ozk-wizard { background: var(--ozk-flaeche); border: 1px solid var(--ozk-rand); border-radius: var(--ozk-radius); padding: 16px; min-width: 0; }
.ozk-seitenleiste { display: grid; gap: 16px; min-width: 0; }
.ozk-box { background: var(--ozk-flaeche); border: 1px solid var(--ozk-rand); border-radius: var(--ozk-radius); padding: 16px; }
.ozk-box h2 { font-size: 1rem; font-weight: 700; margin-bottom: 10px; }
.ozk-box dl { display: grid; gap: 8px; font-size: .92rem; }
.ozk-box dt { color: var(--ozk-text-leise); font-size: .8rem; }
.ozk-box dd { overflow-wrap: anywhere; }
.ozk-box .ozk-kontaktliste { display: grid; gap: 8px; font-size: .95rem; }
.ozk-box .ozk-kontaktliste a { font-weight: 600; }

/* ---------- Fortschritt ---------- */
.ozk-fortschritt { margin-bottom: 18px; }
.ozk-fortschritt ol { display: flex; gap: 6px; align-items: stretch; }
.ozk-fortschritt li { flex: 1 1 0; min-width: 0; }
.ozk-fortschritt .ozk-fs { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 0; background: none; border: 0; color: var(--ozk-text-leise); font: inherit; font-size: .78rem; text-align: left; cursor: default; }
.ozk-fortschritt button.ozk-fs { cursor: pointer; }
.ozk-fortschritt .ozk-fs::before { content: ""; display: block; width: 100%; height: 5px; border-radius: 3px; background: var(--ozk-rand); }
.ozk-fortschritt .ist-fertig::before { background: var(--ozk-primaer); opacity: .55; }
.ozk-fortschritt .ist-aktiv::before { background: var(--ozk-primaer); }
.ozk-fortschritt .ist-aktiv { color: var(--ozk-text); font-weight: 700; }
.ozk-fortschritt .ozk-fs-name { display: none; }
.ozk-fortschritt-text { margin-top: 10px; font-size: .85rem; color: var(--ozk-text-leise); }
.ozk-fortschritt-text strong { color: var(--ozk-text); }

/* ---------- Schritt-Inhalt ---------- */
.ozk-schritt > h2 { font-size: 1.4rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
.ozk-schritt > .ozk-einleitung { color: var(--ozk-text-leise); margin: 6px 0 18px; max-width: 65ch; }
.ozk .ozk-gruppe { margin-top: 22px; }
.ozk-gruppe > legend, .ozk-gruppe > h3 { font-size: 1rem; font-weight: 700; margin-bottom: 10px; }
.ozk-gruppe > .ozk-hilfe { margin: -6px 0 10px; }
.ozk-hilfe { font-size: .85rem; color: var(--ozk-text-leise); }
.ozk-pflicht { color: var(--ozk-primaer-text); font-weight: 700; }
.ozk-felder { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.ozk-feld { display: grid; gap: 5px; min-width: 0; align-content: start; }
.ozk-feld > label { font-size: .9rem; font-weight: 600; }
.ozk-feld .ozk-optional { font-weight: 400; color: var(--ozk-text-leise); }
.ozk input[type="text"], .ozk input[type="email"], .ozk input[type="tel"], .ozk input[type="number"], .ozk input[type="date"], .ozk select, .ozk textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; font: inherit; color: var(--ozk-text); background: var(--ozk-flaeche);
  border: 1px solid var(--ozk-rand-stark); border-radius: var(--ozk-radius-klein); }
.ozk textarea { min-height: 110px; resize: vertical; }
.ozk input::placeholder, .ozk textarea::placeholder { color: var(--ozk-text-leise); opacity: .75; }
.ozk [aria-invalid="true"] { border-color: var(--ozk-fehler) !important; border-width: 2px !important; }
.ozk-feldfehler { color: var(--ozk-fehler); font-size: .85rem; font-weight: 600; }
.ozk-feldfehler:empty { display: none; }
.ozk-fehlerliste { border: 2px solid var(--ozk-fehler); background: var(--ozk-fehler-flaeche); border-radius: var(--ozk-radius-klein); padding: 12px 14px; margin-bottom: 18px; }
.ozk-fehlerliste h3 { font-size: 1rem; margin-bottom: 6px; }
.ozk-fehlerliste ul { list-style: disc; padding-left: 20px; display: grid; gap: 2px; }
.ozk-fehlerliste a { color: var(--ozk-fehler); font-weight: 600; }

/* ---------- Auswahlkarten (Radio / Checkbox) ---------- */
.ozk-karten { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.ozk-karte { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px; border: 1px solid var(--ozk-rand-stark); border-radius: var(--ozk-radius-klein); background: var(--ozk-flaeche); cursor: pointer; }
.ozk-karte:hover { border-color: var(--ozk-primaer); }
.ozk-karte.ist-gewaehlt { border-color: var(--ozk-primaer); box-shadow: inset 0 0 0 1px var(--ozk-primaer); background: var(--ozk-primaer-flaeche); }
.ozk-karte:focus-within { outline: 3px solid var(--ozk-fokus); outline-offset: 2px; }
.ozk-karte input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ozk-primaer); }
.ozk-karte input:focus-visible { outline: none; }
.ozk-karte-titel { display: block; font-weight: 700; }
.ozk-karte-kennung { font-family: var(--ozk-mono); font-size: .8rem; color: var(--ozk-text-leise); font-weight: 400; margin-left: 4px; white-space: nowrap; }
.ozk-karte-text { display: block; font-size: .9rem; color: var(--ozk-text-leise); margin-top: 2px; }
.ozk-karte-preis { display: block; font-size: .9rem; font-weight: 600; margin-top: 6px; }
.ozk-wahl { display: flex; flex-wrap: wrap; gap: 8px; }
.ozk-wahl label { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--ozk-rand-stark); border-radius: 999px; cursor: pointer; font-size: .92rem; background: var(--ozk-flaeche); }
.ozk-wahl label.ist-gewaehlt { border-color: var(--ozk-primaer); background: var(--ozk-primaer-flaeche); font-weight: 600; }
.ozk-wahl label:focus-within { outline: 3px solid var(--ozk-fokus); outline-offset: 2px; }
.ozk-wahl input { accent-color: var(--ozk-primaer); width: 18px; height: 18px; margin: 0; }
.ozk-wahl input:focus-visible { outline: none; }
.ozk-haken { display: grid; gap: 4px; grid-template-columns: minmax(0, 1fr); }
.ozk-haken label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 6px; border-radius: 8px; cursor: pointer; font-size: .95rem; }
.ozk-haken label:hover { background: var(--ozk-flaeche-2); }
.ozk-haken input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ozk-primaer); }
.ozk-zustimmung label { border: 1px solid var(--ozk-rand); padding: 12px; }
.ozk-zustimmung label.hat-fehler { border-color: var(--ozk-fehler); border-width: 2px; }

/* ---------- Hinweise ---------- */
.ozk-hinweis { border-left: 4px solid var(--ozk-hinweis-rand); background: var(--ozk-hinweis-flaeche); border-radius: 0 var(--ozk-radius-klein) var(--ozk-radius-klein) 0; padding: 12px 14px; font-size: .92rem; }
.ozk-hinweis.ist-neutral { border-left-color: var(--ozk-rand-stark); background: var(--ozk-flaeche-2); }
.ozk-hinweis.ist-ok { border-left-color: var(--ozk-ok); background: var(--ozk-ok-flaeche); }
.ozk-hinweis.ist-fehler { border-left-color: var(--ozk-fehler); background: var(--ozk-fehler-flaeche); }
.ozk-hinweis h3, .ozk-hinweis h4 { font-size: .95rem; font-weight: 700; margin-bottom: 4px; }
.ozk-hinweis ul { list-style: disc; padding-left: 18px; display: grid; gap: 2px; }
.ozk-hinweis p + p, .ozk-hinweis ul + p, .ozk-hinweis p + ul { margin-top: 6px; }
.ozk-zweispaltig { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.ozk-adresse { font-style: normal; border: 1px dashed var(--ozk-rand-stark); border-radius: var(--ozk-radius-klein); padding: 12px 14px; font-weight: 600; line-height: 1.45; }

/* ---------- Fehlercode-Chips ---------- */
.ozk-chipzeile { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.ozk-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.ozk-chips:empty { display: none; }
.ozk-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--ozk-flaeche-2); border: 1px solid var(--ozk-rand-stark); font-family: var(--ozk-mono); font-size: .9rem; }
.ozk-chip button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent; color: var(--ozk-text); font-size: 1.1rem; line-height: 1; cursor: pointer; }
.ozk-chip button:hover { background: var(--ozk-rand); }

/* ---------- Schaltflächen ---------- */
.ozk-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 22px; border-radius: 999px; border: 1px solid transparent; font: inherit; font-weight: 700; font-size: .95rem; text-decoration: none; cursor: pointer; text-align: center; }
.ozk-btn-primaer, .ozk a.ozk-btn-primaer { background: var(--ozk-primaer); color: var(--ozk-auf-primaer); }
.ozk-btn-primaer:hover { background: var(--ozk-primaer-dunkel); }
.ozk-btn-zweit, .ozk a.ozk-btn-zweit { background: transparent; color: var(--ozk-text); border-color: var(--ozk-rand-stark); }
.ozk-btn-zweit:hover { border-color: var(--ozk-text); }
.ozk-btn-klein { min-height: 40px; padding: 6px 14px; font-size: .85rem; }
.ozk-btn[disabled] { opacity: .6; cursor: progress; }
.ozk-btn-text { background: none; border: 0; padding: 4px 2px; font: inherit; font-size: .88rem; font-weight: 600; color: var(--ozk-primaer-text); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 32px; }
.ozk-navigation { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--ozk-rand); }
.ozk-navigation .ozk-btn-primaer { margin-left: auto; }
.ozk-aktionen { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); margin-top: 12px; }

/* ---------- Zusammenfassung ---------- */
.ozk-auftragsnr { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 12px 14px; border: 1px solid var(--ozk-rand); border-radius: var(--ozk-radius-klein); background: var(--ozk-flaeche-2); }
.ozk-auftragsnr strong { font-family: var(--ozk-mono); font-size: 1.2rem; letter-spacing: .04em; }
.ozk-abschnitt { border: 1px solid var(--ozk-rand); border-radius: var(--ozk-radius-klein); padding: 14px; margin-top: 12px; }
.ozk-abschnitt-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.ozk-abschnitt h3 { font-size: 1rem; font-weight: 700; }
.ozk-abschnitt dl { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px 14px; font-size: .92rem; }
.ozk-abschnitt dt { color: var(--ozk-text-leise); font-size: .8rem; margin-top: 6px; }
.ozk-abschnitt dd { overflow-wrap: anywhere; white-space: pre-line; }
.ozk-preise { width: 100%; border-collapse: collapse; font-size: .92rem; }
.ozk-preise th, .ozk-preise td { text-align: left; padding: 8px 0; border-bottom: 1px solid var(--ozk-rand); vertical-align: top; font-weight: 400; }
.ozk-preise td { text-align: right; padding-left: 12px; font-variant-numeric: tabular-nums; }
.ozk-preise tfoot th, .ozk-preise tfoot td { font-weight: 700; border-bottom: 0; }
.ozk-preise small { display: block; color: var(--ozk-text-leise); }
.ozk textarea.ozk-kopiertext { font-family: var(--ozk-mono); font-size: .8rem; min-height: 140px; margin-top: 8px; }

/* ---------- FAQ und Fuß ---------- */
.ozk-faq { margin-top: 32px; max-width: 820px; }
.ozk-faq details { border: 1px solid var(--ozk-rand); border-radius: var(--ozk-radius-klein); background: var(--ozk-flaeche); margin-top: 8px; }
.ozk-faq summary { padding: 14px 16px; font-weight: 600; cursor: pointer; }
.ozk-faq details p { padding: 0 16px 14px; color: var(--ozk-text-leise); max-width: 70ch; }
.ozk-fuss { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--ozk-rand); font-size: .85rem; color: var(--ozk-text-leise); }
#ozk-druckbogen { display: none; }

/* ---------- ab 560 px ---------- */
@media (min-width: 560px) {
  .ozk-innen { padding: 28px 24px 56px; }
  .ozk-wizard { padding: 24px; }
  .ozk-ablauf ol { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ozk-felder { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ozk-feld.ist-breit { grid-column: 1 / -1; }
  .ozk-haken.ist-zweispaltig { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ozk-zweispaltig { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ozk-abschnitt dl { grid-template-columns: minmax(120px, 200px) minmax(0, 1fr); }
  .ozk-abschnitt dt { margin-top: 0; padding-top: 3px; }
  .ozk-aktionen { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* ---------- ab 760 px ---------- */
@media (min-width: 760px) {
  .ozk-fortschritt .ozk-fs-name { display: block; font-size: .72rem; overflow-wrap: break-word; hyphens: auto; }
  .ozk-fortschritt-text { display: none; }
  .ozk-karten.ist-zweispaltig { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* ---------- ab 1000 px ---------- */
@media (min-width: 1000px) {
  .ozk-ablauf ol { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .ozk-raster { grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; }
  .ozk-seitenleiste { position: sticky; top: 16px; }
  .ozk-wizard { padding: 32px; }
}
@media (prefers-reduced-motion: no-preference) {
  .ozk-btn, .ozk-karte, .ozk-wahl label { transition: background-color .15s, border-color .15s; }
}

/* ---------- Druck: nur die Arbeitskarte (A4) ---------- */
@media print {
  @page { size: A4; margin: 11mm 12mm; }
  html, body { background: #fff !important; }
  body > *:not(#ozk-druckbogen) { display: none !important; }
  #ozk-druckbogen { display: block !important; }
}
.ozk-druck { font-family: var(--ozk-schrift); color: #000; background: #fff; font-size: 9.6pt; line-height: 1.35; }
.ozk-druck *, .ozk-druck *::before { box-sizing: border-box; }
.ozk-druck h1, .ozk-druck h2, .ozk-druck p, .ozk-druck ul, .ozk-druck dl, .ozk-druck dd { margin: 0; padding: 0; }

.ozk-druck dt { color: #444; }
.ozk-druck dd { overflow-wrap: anywhere; white-space: pre-line; font-weight: 600; }
.ozk-druck-breit { grid-column: 1 / -1; }
.ozk-druck-preise dl { grid-template-columns: 80mm 1fr; }
.ozk-druck ul.ozk-druck-reihe { display: flex; flex-wrap: wrap; gap: .6mm 6mm; }
